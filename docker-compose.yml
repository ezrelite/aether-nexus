version: '3.8'

services:
  aether-core:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: aether_core
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis-cortex:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - redis-cortex
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  redis-cortex:
    image: redis:alpine
    container_name: redis_cortex
    ports:
      - "6379:6379"
    restart: always
