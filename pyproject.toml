[project]
name = "aether-core"
version = "0.1.0"
description = "Aether: Autonomous Executive Task & High-Efficiency Router"
authors = [
    {name = "AETHER Team", email = "dev@aether.ai"},
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "redis>=5.0.1",
    "google-genai>=0.1.0",
    "playwright>=1.41.0",
    "pandas>=2.2.0",
    "reportlab>=4.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ipv6 = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
